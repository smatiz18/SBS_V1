[package]
name = "rust_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
actix-web = "4"
actix-cors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
log = "0.4"
env_logger = "0.10"
mongodb = { version = "2.0", features = ["tokio-runtime"] }
bson = "2.0"
futures-util = "0.3" 
awc = "3.5.1"        
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
strum = "0.24.1"
strum_macros = "0.24.1"
pyo3 = { version = "0.22.5", features = ["extension-module", "auto-initialize"], optional = true }
once_cell = "1.20.2"
lettre = "0.10"
tokio = "1.41.1"
urlencoding = "2.1.0"
serde_urlencoded = "0.7"
scraper = "0.17"

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-undefined",
  "-C", "link-arg=dynamic_lookup",
]

[features]
default = []  # Default does not include `pyo3`
pyo3_required = ["dep:pyo3"]  # Only enables `pyo3` when explicitly requested

[[bin]]
name = "sbs_v1_daily_data_loaders"
path = "src/bin/sbs_v1_daily_data_loaders.rs"
required-features = ["pyo3_required"]

[[bin]]
name = "sbs_v1_rust_backend_api"
path = "src/bin/sbs_v1_rust_backend_api.rs"