name: Auto Merge Dev to Main

on:
  schedule:
    - cron: "0 3 * * *"  # Runs every day at 3 AM UTC (10 PM EST)
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Ensures full Git history

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"

      - name: Authenticate with Personal Access Token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_ACTIONS_PAT }}@github.com/smatiz18/SBS_V1.git
          git fetch origin

      - name: Merge Dev into Main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff dev -m "Automated merge from dev to main"
          git push origin main
